[package]
name = "albedo"
version = "0.1.0"
description = "Local 3D asset viewer"
authors = ["Fabien Polly"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The retopology and baking engine. Pure Rust: no CUDA, no Python, no C++, and
# nothing to install on a build machine.
#
# These are path dependencies and they must not ship as such. The clean answer
# is a git dependency on the plancton repository, but that repository has never
# been pushed, so a git dependency cannot resolve. The path is five levels deep
# and works on exactly one machine. See docs/RETOPO.md.
plancton-core = { path = "../../../../../Users/infinition/Desktop/plancton/crates/plancton-core" }
plancton-remesh = { path = "../../../../../Users/infinition/Desktop/plancton/crates/plancton-remesh" }
plancton-bake = { path = "../../../../../Users/infinition/Desktop/plancton/crates/plancton-bake" }

# Attaching the shell provider from inside the application, so a portable copy
# can offer it without an installer.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
# `panic = "abort"` stays, and the engine runs in a child process because of it.
#
# Dropping it so a `catch_unwind` could fire was measured at 4,173,312 bytes,
# five times what the engine itself weighs, because unwinding tables land on the
# whole binary rather than on the engine alone. A child process is the cheaper
# guard and the stronger one: it also survives a stack overflow and an
# allocation failure, which no `catch_unwind` catches. See docs/RETOPO.md.

# Retopology is compute bound and would otherwise inherit `opt-level = "s"`,
# which is right for a viewer and wrong for a decimator running quadric error
# metrics over a million triangles.
[profile.release.package.plancton-core]
opt-level = 3
[profile.release.package.plancton-remesh]
opt-level = 3
[profile.release.package.plancton-bake]
opt-level = 3

# The BVH and the decimator are unusable at `opt-level = 0` on a real mesh, so a
# debug build still optimises them while keeping fast recompiles of our own code.
[profile.dev.package.plancton-core]
opt-level = 3
[profile.dev.package.plancton-remesh]
opt-level = 3
[profile.dev.package.plancton-bake]
opt-level = 3
