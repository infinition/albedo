[package]
name = "albedo"
version = "0.1.0"
description = "Local 3D asset viewer"
authors = ["Fabien Polly"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Attaching the shell provider from inside the application, so a portable copy
# can offer it without an installer.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
