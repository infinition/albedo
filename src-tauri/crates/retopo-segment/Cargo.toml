[package]
name = "retopo-segment"
version = "1.4.0"
edition = "2021"
authors = ["Fabien Polly"]
license = "MIT"
description = "Part and material segmentation for Albedo: per face features, an affinity graph and a hierarchical decomposition"

[dependencies]
retopo-core = { path = "../retopo-core" }
glam = { version = "0.29", features = ["bytemuck"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
