[package]
name = "retopo-core"
version = "1.3.0"
edition = "2021"
authors = ["Fabien Polly"]
license = "MIT"
description = "Mesh representation, BVH, glTF import and export for Albedo's retopology engine"

[dependencies]
glam = { version = "0.29", features = ["bytemuck"] }
rayon = "1.10"
gltf = { version = "1.4", features = ["import", "utils", "names", "KHR_texture_transform", "extensions"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
