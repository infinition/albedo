name: Desktop builds and releases

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: --bundles nsis
          - os: ubuntu-24.04
            artifact: linux-x64
            args: --bundles deb,rpm,appimage
          - os: macos-15
            artifact: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libfuse2t64 python3-gi gir1.2-webkit2-4.1 xvfb xauth libgl1-mesa-dri
      - run: npm ci
      - run: npm test
      - name: Native metadata and thumbnail resource checks
        run: python tests/platforms.test.py
      - name: Build frontend and native thumbnail provider
        run: npm run build:all
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p albedo -p retopo-core -p retopo-remesh -p retopo-bake
      # Tauri embeds the frontend; a bare cargo build can retain the dev URL.
      - name: Build production application and packages
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Windows thumbnail rendering
        if: runner.os == 'Windows'
        run: python scripts/thumbnail-smoke.py --binary src-tauri/target/release/albedo.exe
      - name: Linux thumbnail rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          python3 scripts/thumbnail-smoke.py --linux-provider /usr/bin/albedo-thumbnailer
          xvfb-run -a python3 scripts/thumbnail-smoke.py --binary src-tauri/target/release/albedo
      - name: Verify macOS application and Quick Look extension
        if: runner.os == 'macOS'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Albedo.app
          test -f "$APP/Contents/PlugIns/AlbedoThumbnail.appex/Contents/MacOS/AlbedoThumbnail"
          lipo "$APP/Contents/MacOS/albedo" -verify_arch arm64 x86_64
          lipo "$APP/Contents/PlugIns/AlbedoThumbnail.appex/Contents/MacOS/AlbedoThumbnail" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          python3 scripts/thumbnail-smoke.py --binary "$APP/Contents/MacOS/albedo"
          python3 scripts/thumbnail-smoke.py --mac-app "$APP"
      - name: Prepare assets and verify embedded Windows provider
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: albedo-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: albedo-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v1.5.3.md
          files: release-assets/*
          fail_on_unmatched_files: true
